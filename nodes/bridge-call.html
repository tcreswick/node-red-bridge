<script type="text/javascript">
RED.nodes.registerType('bridge-call', {
  category: 'common', color: '#a6bbcf',
  defaults: { name: { value: '' }, remote: { type: 'bridge-remote', required: true }, target: { value: '' }, remotes: { value: [] }, timeout: { value: 10, validate: RED.validators.number() } },
  inputs: 1, outputs: 1, icon: 'link-out.svg',
  paletteLabel: 'bridge call',
  label: function () { return this.name || (this.target ? 'call ' + this.target : 'bridge call'); },
  oneditprepare: function () {
    var ticks = $('#br-ticks');
    window.bridgeUI.renderTicks(ticks, this.remotes);
    function load() {
      var id = $('#node-input-remote').val(), dl = $('#br-targets').empty();
      if (!id || id === '_ADD_') return;
      window.bridgeUI.api(id, 'state').done(function (s) { (s.ins || []).forEach(function (n) { $('<option/>').val(n).appendTo(dl); }); });
      var cb = ticks.find('input[data-id="' + id + '"]'); if (cb.length) cb.prop('checked', true);
    }
    $('#node-input-remote').on('change', load); setTimeout(load, 100);
  },
  oneditsave: function () { this.remotes = window.bridgeUI.readTicks($('#br-ticks')); }
});
</script>
<script type="text/html" data-template-name="bridge-call">
  <div class="form-row"><label for="node-input-name"><i class="fa fa-tag"></i> Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-remote"><i class="fa fa-globe"></i> Remote</label><input type="text" id="node-input-remote"></div>
  <div class="form-row"><label for="node-input-target"><i class="fa fa-bullseye"></i> Target</label><input type="text" id="node-input-target" list="br-targets" placeholder="bridge-in name on the remote"><datalist id="br-targets"></datalist></div>
  <div class="form-row"><label for="node-input-timeout"><i class="fa fa-clock-o"></i> Timeout (s)</label><input type="number" id="node-input-timeout" style="width:80px"></div>
  <div class="form-row"><label>Allowed to see this node</label><div id="br-ticks" style="margin-left:10px"></div></div>
</script>
<script type="text/html" data-help-name="bridge-call">
<p>Request/response across the link. Sends the message to a <code>bridge-in</code> on the remote and outputs the message that the remote returns through a <code>bridge reply</code> node.</p>
<p>Errors (offline, unknown target, timeout) go to a Catch node. <code>msg.bridgeTarget</code> overrides the target. Visibility tick-boxes work like bridge-out.</p>
</script>
